[project]
name = "scalper"
version = "0.1.0"
description = "Standalone scalping research agent: data collection first, then backtest, then paper."
requires-python = ">=3.11"
dependencies = [
  "alpaca-py>=0.44",
  "pyarrow>=15",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
scalper = "scalper.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
