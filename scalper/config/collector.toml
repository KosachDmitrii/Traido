# Tickers to record. Start with a few liquid names; quotes volume is large.
symbols = ["SPY", "QQQ", "AAPL", "NVDA", "TSLA"]

feed = "sip"          # "sip" needs the paid market-data plan; "iex" works on the free one
trades = true
quotes = true
rth_only = true       # keep only 09:30-16:00 America/New_York

data_dir = "data"
flush_rows = 50000    # write a parquet part after this many buffered rows per (kind, symbol)
flush_seconds = 30    # ...or after this long, whichever comes first
